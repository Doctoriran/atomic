<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>درباره ما | Atomic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
    <!-- هدر (کپی از index.html) -->
    <header class="header" id="header">...</header>

    <section style="padding: 120px 0 60px;">
        <div class="container">
            <h1 style="font-size: 42px; font-weight: 900;">درباره Atomic</h1>
            <p style="color: var(--text-muted); font-size: 18px; max-width: 600px; margin-top: 12px;">
                ما با عشق به مد و کیفیت، لباس‌هایی طراحی می‌کنیم که انرژی و شخصیت شما را نشان دهند.
            </p>
            <div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px;">
                <div style="background: var(--dark-3); padding: 30px; border-radius: var(--radius); border: 1px solid var(--border); text-align: center;">
                    <i class="fas fa-award" style="font-size: 40px; color: var(--primary);"></i>
                    <h3 style="margin-top: 12px;">کیفیت برتر</h3>
                    <p style="color: var(--text-muted);">استفاده از بهترین پارچه‌ها</p>
                </div>
                <div style="background: var(--dark-3); padding: 30px; border-radius: var(--radius); border: 1px solid var(--border); text-align: center;">
                    <i class="fas fa-truck" style="font-size: 40px; color: var(--primary);"></i>
                    <h3 style="margin-top: 12px;">ارسال سریع</h3>
                    <p style="color: var(--text-muted);">تحویل در کمترین زمان</p>
                </div>
                <div style="background: var(--dark-3); padding: 30px; border-radius: var(--radius); border: 1px solid var(--border); text-align: center;">
                    <i class="fas fa-headset" style="font-size: 40px; color: var(--primary);"></i>
                    <h3 style="margin-top: 12px;">پشتیبانی ۲۴/۷</h3>
                    <p style="color: var(--text-muted);">همیشه در کنار شما هستیم</p>
                </div>
            </div>
        </div>
    </section>

    <!-- فوتر (کپی از index.html) -->
    <footer class="footer">...</footer>

    <script src="js/main.js"></script>
</body>
</html>
