<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تماس با ما | Atomic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
    <!-- هدر (کپی از index.html) -->
    <header class="header" id="header">...</header>

    <section style="padding: 120px 0 60px;">
        <div class="container">
            <h1 style="font-size: 42px; font-weight: 900;">تماس با ما</h1>
            <p style="color: var(--text-muted); font-size: 18px; max-width: 600px; margin-top: 12px;">
                خوشحال می‌شویم پیام‌های شما را بشنویم
            </p>
            <div style="margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                <form id="contactForm" style="background: var(--dark-3); padding: 30px; border-radius: var(--radius); border: 1px solid var(--border);">
                    <input type="text" placeholder="نام شما" required style="width: 100%; padding: 14px; background: var(--dark-2); border: 1px solid var(--border); border-radius: var(--radius); color: #fff; margin-bottom: 16px;" />
                    <input type="email" placeholder="ایمیل شما" required style="width: 100%; padding: 14px; background: var(--dark-2); border: 1px solid var(--border); border-radius: var(--radius); color: #fff; margin-bottom: 16px;" />
                    <textarea placeholder="پیام شما" required rows="5" style="width: 100%; padding: 14px; background: var(--dark-2); border: 1px solid var(--border); border-radius: var(--radius); color: #fff; margin-bottom: 16px; resize: vertical;"></textarea>
                    <button type="submit" style="width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: var(--radius); color: #fff; font-weight: 600; font-size: 16px; cursor: pointer;">ارسال پیام</button>
                </form>
                <div>
                    <h3>اطلاعات تماس</h3>
                    <p style="color: var(--text-muted); margin-top: 12px;"><i class="fas fa-phone" style="color: var(--primary); width: 24px;"></i> ۰۲۱-۱۲۳۴-۵۶۷۸</p>
                    <p style="color: var(--text-muted); margin-top: 8px;"><i class="fas fa-envelope" style="color: var(--primary); width: 24px;"></i> info@atomicshop.com</p>
                    <p style="color: var(--text-muted); margin-top: 8px;"><i class="fas fa-map-marker-alt" style="color: var(--primary); width: 24px;"></i> تهران، خیابان ولیعصر، پلاک ۱۲۳</p>
                </div>
            </div>
        </div>
    </section>

    <!-- فوتر (کپی از index.html) -->
    <footer class="footer">...</footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('✅ پیام شما با موفقیت ارسال شد!');
            this.reset();
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
